name: Linux build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ShaunsAudioVisualizer.slnx
      - name: Build (Linux solution filter)
        run: dotnet build ShaunsAudioVisualizer.Linux.slnf --configuration Release --no-restore
      - name: Test (Linux solution filter)
        run: dotnet test ShaunsAudioVisualizer.Linux.slnf --configuration Release --no-build