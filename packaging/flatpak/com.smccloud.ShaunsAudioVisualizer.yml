app-id: com.smccloud.ShaunsAudioVisualizer
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: shauns-audio-visualizer
finish-args:
  - --share=ipc
  - --socket=pulseaudio
  - --device=dri
modules:
  - name: dotnet
    buildsystem: simple
    build-commands:
      - echo "dotnet provided by sdk extension"
  - name: shauns-audio-visualizer
    buildsystem: simple
    build-commands:
      - dotnet publish ShaunsAudioVisualizer/ShaunsAudioVisualizer.csproj
          --configuration Release --framework net10.0
          --runtime linux-x64 --self-contained false
          --output /app/bin
      - install -Dm755 /app/bin/ShaunsAudioVisualizer /app/bin/shauns-audio-visualizer
    sources:
      - type: dir
        path: ../..